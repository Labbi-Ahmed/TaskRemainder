  <!-- Accent dot (discipline/focus) -->
  <circle cx="94" cy="34" r="10" fill="#4ADE80" stroke="white" stroke-width="3" />

  <defs>
    <filter id="filter0_d" x="32" y="34" width="64" height="66" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
