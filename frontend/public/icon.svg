  <g filter="url(#filter0_d)">
    <path d="M64 36C48.536 36 36 48.536 36 64C36 79.464 48.536 92 64 92C79.464 92 92 79.464 92 64C92 48.536 79.464 36 64 36ZM64 86.4C51.652 86.4 41.6 76.348 41.6 64C41.6 51.652 51.652 41.6 64 41.6C76.348 41.6 86.4 51.652 86.4 64C86.4 76.348 76.348 86.4 64 86.4Z" fill="white"/>
    <path d="M66.8 49.2H61.2V65.44L72.4 73L75.2 68.32L66.8 62.64V49.2Z" fill="white"/>
