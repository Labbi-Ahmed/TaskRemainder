<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Rounded square background: indigo gradient matching the app -->
  <rect width="128" height="128" rx="26" fill="url(#grad)"/>

  <!-- Subtle inner border highlight for depth -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="24" stroke="white" stroke-opacity="0.14" stroke-width="1.5" fill="none"/>

  <!-- Soft inner glow layer -->
  <circle cx="64" cy="64" r="46" fill="white" fill-opacity="0.05"/>

  <!-- Clock ring -->
  <circle cx="64" cy="64" r="36" stroke="white" stroke-width="7.5" fill="white" fill-opacity="0.07"/>

  <!-- Tick marks at 12 / 3 / 6 / 9 -->
  <line x1="64" y1="29.5" x2="64" y2="38.5" stroke="white" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <line x1="98.5" y1="64" x2="89.5" y2="64" stroke="white" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="98.5" x2="64" y2="89.5" stroke="white" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <line x1="29.5" y1="64" x2="38.5" y2="64" stroke="white" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>

  <!-- Bold checkmark centred inside the clock -->
  <!-- Short left arm: (46,66) → (57,77)  Long right arm: (57,77) → (82,48) -->
  <path d="M46 66 L57 77 L82 48"
        stroke="white"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

</svg>
